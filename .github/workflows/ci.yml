name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR makes the running checks moot.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, build, auth schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:check
      # convex/_generated is committed, so types check without a deployment.
      - run: pnpm typecheck
      - run: pnpm test
      # The e2e job builds for production too (it tests that frozen build), but
      # only after installing browsers and a backend. This fails in minutes, in
      # parallel, on the bundler's server/client import rules alone.
      - name: Production build
        run: pnpm build
        env:
          VITE_CONVEX_URL: https://ci-placeholder.convex.cloud
          VITE_CONVEX_SITE_URL: https://ci-placeholder.convex.site
      # Regenerates the better-auth schema from the plugin set and fails on drift.
      - run: pnpm auth:check

  e2e:
    # One runner per shard, so each keeps the suite's isolation: its own throwaway
    # Convex backend, rate-limit buckets and tables. With fullyParallel off,
    # Playwright shards by file, so a file's beforeAll seeding stays in one shard.
    # The setup project is a dependency and runs on every shard.
    name: Browser tests (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Four balances best by measured time; the split is by test count, file by file.
        shard: [1, 2, 3, 4]
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Versions for cache keys
        id: versions
        run: |
          echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "convex=$(node -p "require('convex/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.versions.outputs.playwright }}-chromium-webkit
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Install Playwright system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # The local Convex backend binary the harness downloads on first run.
      - name: Cache Convex local backend
        uses: actions/cache@v4
        with:
          path: ~/.cache/convex
          key: convex-backend-${{ runner.os }}-${{ steps.versions.outputs.convex }}

      # A frozen production build of this commit, against a throwaway local
      # Convex backend in .e2e/app (see scripts/e2e/backend.mjs). No deploy key,
      # no real deployment. The run's commit and snapshot hash are printed at the
      # start and recorded in the report's metadata.
      - run: pnpm e2e --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Merged into one HTML report by the job below.
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 1
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: test-results
          retention-days: 14

  e2e-report:
    # The one check that says whether the whole browser suite passed.
    name: Browser tests (Playwright)
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge shard reports
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Fail if any shard failed
        if: ${{ needs.e2e.result != 'success' }}
        run: |
          echo "Browser test shards ended with: ${{ needs.e2e.result }}"
          exit 1
