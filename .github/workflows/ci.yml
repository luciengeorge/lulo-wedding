name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR makes the running checks moot.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, types, unit tests, build, auth schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:check
      # convex/_generated is committed, so types check without a deployment.
      - run: pnpm typecheck
      - run: pnpm test
      # The browser tests run Vite in dev mode, which never applies the production
      # bundler's server/client import rules; only a real build does.
      - name: Production build
        run: pnpm build
        env:
          VITE_CONVEX_URL: https://ci-placeholder.convex.cloud
          VITE_CONVEX_SITE_URL: https://ci-placeholder.convex.site
      # Regenerates the better-auth schema from the plugin set and fails on drift.
      - run: pnpm auth:check

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Versions for cache keys
        id: versions
        run: |
          echo "playwright=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "convex=$(node -p "require('convex/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.versions.outputs.playwright }}-chromium-webkit
      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Install Playwright system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # The local Convex backend binary the harness downloads on first run.
      - name: Cache Convex local backend
        uses: actions/cache@v4
        with:
          path: ~/.cache/convex
          key: convex-backend-${{ runner.os }}-${{ steps.versions.outputs.convex }}

      # Runs against a throwaway local Convex backend in .e2e/app (see
      # scripts/e2e/backend.mjs). No deploy key, no real deployment.
      - run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results
          retention-days: 14
