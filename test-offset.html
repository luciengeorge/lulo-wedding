<!DOCTYPE html>
<html>
<body>
  <div id="nav" style="position: sticky; top: 0; width: 300px; display: flex;">
    <div id="strip" style="overflow-x: auto; flex: 1; display: flex; gap: 20px;">
      <div style="width: 100px; flex-shrink: 0; background: red;">1</div>
      <div id="link" style="width: 100px; flex-shrink: 0; background: blue;">2</div>
      <div style="width: 100px; flex-shrink: 0; background: green;">3</div>
      <div style="width: 100px; flex-shrink: 0; background: yellow;">4</div>
    </div>
  </div>
  <script>
    const strip = document.getElementById('strip');
    const link = document.getElementById('link');
    console.log('Initial offsetLeft:', link.offsetLeft);
    strip.scrollLeft = 50;
    console.log('After scroll offsetLeft:', link.offsetLeft);
  </script>
</body>
</html>
